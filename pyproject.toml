[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtchart-sdk"
version = "0.2.0"
description = "SDK for building thermal monitoring, traceability, and reporting systems derived from MTChart Pro."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
authors = [
    { name = "MTD Softwares" }
]
keywords = [
    "monitoring",
    "thermal-process",
    "traceability",
    "aviation",
    "industrial",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/Romero-Softwares/MTChart_Pro"
Repository = "https://github.com/Romero-Softwares/MTChart_Pro"
Documentation = "https://github.com/Romero-Softwares/MTChart_Pro/tree/main/sdk#readme"
Issues = "https://github.com/Romero-Softwares/MTChart_Pro/issues"

[project.optional-dependencies]
reports = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
mtchart-sdk-demo = "mtchart_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
